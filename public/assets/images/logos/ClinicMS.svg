<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320">
  <rect width="300" height="320" fill="white"></rect>
  <g transform="translate(50,40)">
    <!-- Briefcase -->
    <rect x="0" y="40" rx="20" ry="20" width="200" height="120" fill="#39A9DB" stroke="#0A3965" stroke-width="8"></rect>
    <rect x="70" y="0" rx="10" ry="10" width="60" height="40" fill="none" stroke="#0A3965" stroke-width="8"></rect>
    <!-- ECG Line -->
    <polyline points="30,100 70,100 90,70 110,130 140,100 170,100" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></polyline>
  </g>
  <!-- Text with more bottom spacing -->
  <text x="150" y="270" font-family="Arial, sans-serif" font-weight="bold" font-size="40" text-anchor="middle" fill="#0A3965">ClinicMS</text>
</svg>

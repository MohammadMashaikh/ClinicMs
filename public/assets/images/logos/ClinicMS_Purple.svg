<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <!-- Logo group -->
  <g transform="translate(40,30)">
    <!-- Briefcase -->
    <rect x="0" y="40" rx="20" ry="20" width="120" height="100" fill="#9B8FFA" stroke="#4A3FA4" stroke-width="6"></rect>
    <rect x="40" y="10" rx="8" ry="8" width="40" height="30" fill="none" stroke="#4A3FA4" stroke-width="6"></rect>
    
    <!-- ECG Line -->
    <polyline points="15,90 40,90 55,65 70,115 95,90 115,90" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></polyline>
  </g>
  
  <!-- Text beside logo -->
  <text x="200" y="120" font-family="Arial, sans-serif" font-weight="bold" font-size="50" text-anchor="start" fill="#4A3FA4">ClinicMS</text>
</svg>
